name: Publish scheduled posts to Telegram

on:
  schedule:
    # Проверка каждый час в 5 минут после часа (UTC)
    - cron: "5 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в Actions

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python publish_scheduled.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update published posts state [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "state.json не изменился, коммит не нужен"
          fi
